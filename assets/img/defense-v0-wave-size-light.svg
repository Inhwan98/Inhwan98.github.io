<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="웨이브 크기별 승률: 웨이브가 커질수록 판단형과 나머지의 차이가 커진다" font-family="&#x27;Malgun Gothic&#x27;,&#x27;Apple SD Gothic Neo&#x27;,&#x27;Noto Sans KR&#x27;,system-ui,sans-serif">
<title>웨이브 크기별 승률: 웨이브가 커질수록 판단형과 나머지의 차이가 커진다</title>
<rect x="0" y="0" width="760" height="420" rx="8" fill="#fcfcfb"/>
<text x="20.0" y="30.0" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">웨이브가 커질수록 판단의 몫이 커진다</text>
<text x="20.0" y="52.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">혼성 습격. 웨이브의 묶음마다 몬스터 수를 배수만큼 늘림. 점마다 1,000판</text>
<line x1="20.0" y1="76.0" x2="36.0" y2="76.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="28.0" cy="76.0" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="44.0" y="80.0" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">판단형: 맞춰 두고, 골라 쓴다</text>
<line x1="380.0" y1="76.0" x2="396.0" y2="76.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/>
<circle cx="388.0" cy="76.0" r="4" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="404.0" y="80.0" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">무작위형: 아무렇게나 두고, 아무 때나</text>
<line x1="20.0" y1="96.0" x2="36.0" y2="96.0" stroke="#1baf7a" stroke-width="2" stroke-linecap="round"/>
<circle cx="28.0" cy="96.0" r="4" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<text x="44.0" y="100.0" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">발동만 판단: 아무렇게나 두고, 골라 쓴다</text>
<line x1="380.0" y1="96.0" x2="396.0" y2="96.0" stroke="#eda100" stroke-width="2" stroke-linecap="round"/>
<circle cx="388.0" cy="96.0" r="4" fill="#eda100" stroke="#fcfcfb" stroke-width="2"/>
<text x="404.0" y="100.0" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">배치만 판단: 맞춰 두고, 적 있는 열에 아무 때나</text>
<text x="70.0" y="134.0" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">성벽 체력 하나</text>
