<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="배치별 승률: 배치는 승률을 크게 바꾸지만 정찰 배치가 가장 좋은 고정 배치를 이기는 것은 일부다" font-family="&#x27;Malgun Gothic&#x27;,&#x27;Apple SD Gothic Neo&#x27;,&#x27;Noto Sans KR&#x27;,system-ui,sans-serif">
<title>배치별 승률: 배치는 승률을 크게 바꾸지만 정찰 배치가 가장 좋은 고정 배치를 이기는 것은 일부다</title>
<rect x="0" y="0" width="760" height="500" rx="8" fill="#fcfcfb"/>
<text x="20.0" y="30.0" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">배치는 크게 갈리지만, 정찰의 몫은 작다</text>
<text x="20.0" y="52.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">판단형이 약 80% 이기는 웨이브. 가능한 배치를 모두 같은 1,000판에 돌림. 스킬·도구는 모두 판단형 규칙</text>
<circle cx="26.0" cy="78.0" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<text x="38.0" y="82.0" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">무작위 배치 (가능한 배치 모두의 평균)</text>
<rect x="21.0" y="93.0" width="10" height="10" rx="1.5" fill="#e34948" stroke="#fcfcfb" stroke-width="2"/>
<text x="38.0" y="102.0" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">가장 좋은 고정 배치 (앞 500판으로 고르고 뒤 500판으로 잼)</text>
<circle cx="26.0" cy="118.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="38.0" y="122.0" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">정찰 배치 (판단형, 뒤 500판)</text>
<text x="668.0" y="146.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start">정찰 − 고정</text>
<line x1="200.0" y1="152.0" x2="200.0" y2="454.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<text x="200.0" y="470.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">0%</text>
<line x1="310.0" y1="152.0" x2="310.0" y2="454.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<text x="310.0" y="470.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">25%</text>
<line x1="420.0" y1="152.0" x2="420.0" y2="454.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<text x="420.0" y="470.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">50%</text>
<line x1="530.0" y1="152.0" x2="530.0" y2="454.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<text x="530.0" y="470.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">75%</text>
<line x1="640.0" y1="152.0" x2="640.0" y2="454.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<text x="640.0" y="470.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">100%</text>
<text x="20.0" y="174.0" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="start">혼성 습격</text>
<text x="108.0" y="174.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">전체 체력</text>
